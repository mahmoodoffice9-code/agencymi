<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apex AI | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 border border-white/10 rounded-[2rem] bg-white/5">
        <h2 class="text-3xl font-extrabold mb-6">Login to Portal</h2>
        <form id="authForm" class="space-y-4">
            <input type="text" id="nameInput" placeholder="Enter your full name" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none">
            <button type="submit" class="w-full bg-indigo-600 py-3 rounded-xl font-bold">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            localStorage.setItem('apex_user_name', name || 'Client');
            window.location.href = 'dashboard.html'; // Yahan se dashboard pe bheje ga
        });
    </script>
</body>
</html>
