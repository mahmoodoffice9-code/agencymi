<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Neural | AI Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="p-6 flex justify-between items-center border-b border-white/10">
        <div class="text-2xl font-black">APEX<span class="text-cyan-400">.</span></div>
        <div id="navActions"><button onclick="document.getElementById('loginModal').classList.remove('hidden')" class="bg-indigo-600 px-6 py-2 rounded-xl text-sm font-bold">Login</button></div>
    </nav>

    <!-- MAIN LANDING PAGE (Default) -->
    <section id="landingPage" class="max-w-4xl mx-auto text-center py-20">
        <h1 class="text-6xl font-black mb-6">Scale With <span class="text-indigo-500">Apex Intelligence</span></h1>
        <p class="text-slate-400 mb-10">Professional AI integration & automation.</p>
    </section>

    <!-- PORTAL / CHAT (Hidden until login) -->
    <section id="portalPage" class="hidden max-w-4xl mx-auto p-6">
        <div class="glass rounded-3xl p-8 h-[500px] flex flex-col">
            <h2 class="font-bold mb-4">Support Chat</h2>
            <div id="chatMessages" class="flex-1 overflow-y-auto mb-4 space-y-2"></div>
            <form id="chatForm" class="flex gap-2">
                <input type="text" id="chatInput" class="flex-1 bg-slate-900 p-3 rounded-xl outline-none" placeholder="Message...">
                <button class="bg-indigo-600 px-6 rounded-xl">Send</button>
            </form>
        </div>
    </section>

    <!-- ADMIN PANEL (Hidden until Admin Login) -->
    <section id="adminPage" class="hidden max-w-6xl mx-auto p-6">
        <h2 class="text-2xl font-black mb-6">Admin Panel ⚙️</h2>
        <div class="grid grid-cols-3 gap-6">
            <div id="clientList" class="glass p-4 rounded-2xl"></div>
            <div class="col-span-2 glass p-4 rounded-2xl" id="adminChat">Select a client...</div>
        </div>
    </section>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
        <div class="glass p-8 rounded-3xl w-96">
            <input type="email" id="emailInput" placeholder="Email" class="w-full p-3 bg-slate-900 rounded-xl mb-4">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 p-3 rounded-xl font-bold">Login</button>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "mahmoodoffice9@gmail.com";
        
        function handleLogin() {
            const email = document.getElementById('emailInput').value;
            localStorage.setItem('user_email', email);
            document.getElementById('loginModal').classList.add('hidden');
            renderView();
        }

        function renderView() {
            const email = localStorage.getItem('user_email');
            if(!email) return;

            document.getElementById('landingPage').classList.add('hidden');
            
            if(email === ADMIN_EMAIL) {
                document.getElementById('adminPage').classList.remove('hidden');
            } else {
                document.getElementById('portalPage').classList.remove('hidden');
            }
        }

        window.onload = renderView;
    </script>
</body>
</html>
